let SB_LAST_ERROR="";
async function loadAll(){
  if(!SB_READY&&!initSupabase())return{ok:false,data:null,error:"Supabase isn't configured (missing/placeholder URL or key)."};
  try{
    const{data,error}=await SB.from("app_storage").select("value").eq("key",STORE_KEY).maybeSingle();

    SB_LAST_ERROR="";
    return{ok:true,data:data&&data.value?JSON.parse(data.value):null,error:""};
  }catch(e){
    const msg=(e&&e.message)||String(e);
    console.error("[License Tracker] load failed",e);
    SB_LAST_ERROR=msg;
    return{ok:false,data:null,error:msg};
  }
}
async function saveAll(data){
  if(!SB_READY&&!initSupabase())return{ok:false,error:"Supabase isn't configured."};
  try{
    const{error}=await SB.from("app_storage").upsert({key:STORE_KEY,value:JSON.stringify(data),updated_at:new Date().toISOString()});

    SB_LAST_ERROR="";
    return{ok:true,error:""};

    const msg=(e&&e.message)||String(e);
    console.error("[License Tracker] save failed",e);
    SB_LAST_ERROR=msg;
    return{ok:false,error:msg};
  }
}

function monthsBetween(isoA,isoB){
  const d1=new Date(isoA),d2=new Date(isoB);
  if(isNaN(d1)||isNaN(d2))return null;
  let m=(d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth());
  return m>0?m:null;
}
function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(",")[1]);
    r.onerror=()=>rej(new Error("Could not read file"));
    r.readAsDataURL(file);
  });
}
async function extractDatesFromFile(file){
  const isPdf=file.type==="application/pdf";
  const isImage=file.type.startsWith("image/");
  if(!isPdf&&!isImage)throw new Error("Upload an image (JPG/PNG) or a PDF");
  const base64=await fileToBase64(file);
  // Calls a same-origin Cloudflare Pages Function (see functions/api/extract-dates.js)
  // which holds the real Anthropic API key server-side. A direct browser->Anthropic
  // call cannot work once this app is deployed outside claude.ai — there is no key
  // to send and no proxy to authenticate the request, so this must go through your
  // own backend endpoint instead.
  const resp=await fetch("/api/extract-dates",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({mediaType:isPdf?"application/pdf":file.type,base64,isPdf})
  });
  if(!resp.ok){
    let detail="";
    try{ detail=(await resp.json()).error||""; }catch(e){ try{ detail=await resp.text(); }catch(e2){} }
    throw new Error("Extraction endpoint error "+resp.status+(detail?": "+String(detail).slice(0,200):" — is functions/api/extract-dates.js deployed with an ANTHROPIC_API_KEY secret set?"));
  }
  const data=await resp.json();
  if(data.error)throw new Error(data.error);
  const textBlocks=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const clean=textBlocks.replace(/```json|```/g,"").trim();
  const parsed=JSON.parse(clean);

function computeVerticalMerges(rows,headers,mergeCols){
  const merges=[];
  (mergeCols||[]).forEach(colName=>{
    const c=headers.indexOf(colName);
    if(c<0)return;
    let blockStart=0;
    for(let i=1;i<=rows.length;i++){
      const sameAsBlock=i<rows.length&&rows[i][colName]===rows[blockStart][colName]&&rows[blockStart][colName]!==undefined&&rows[blockStart][colName]!==null&&rows[blockStart][colName]!=="";
      if(!sameAsBlock){
        if(i-1>blockStart){ merges.push({s:{r:blockStart+1,c},e:{r:(i-1)+1,c}}); }
        blockStart=i;
      }
    }
  });
  return merges;
}
function styledSheetFromRows(rows,headerColor,mergeCols){
  if(!rows||!rows.length)return null;
  const headers=Object.keys(rows[0]);
  const aoa=[headers,...rows.map(r=>headers.map(h=>{const v=r[h];return v===undefined||v===null?"":v;}))];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const thin={style:"thin",color:{rgb:"D1D5DB"}};
  const border={top:thin,bottom:thin,left:thin,right:thin};
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let R=range.s.r;R<=range.e.r;R++){
    for(let C=range.s.c;C<=range.e.c;C++){
      const addr=XLSX.utils.encode_cell({r:R,c:C});
      if(!ws[addr])ws[addr]={t:"s",v:""};
      if(R===0){
        ws[addr].s={font:{bold:true,color:{rgb:"FFFFFF"},sz:11},fill:{fgColor:{rgb:(headerColor||"4F46E5").replace("#","")}},border,alignment:{horizontal:"center",vertical:"center",wrapText:true}};
      }else{
        ws[addr].s={border,alignment:{vertical:"center"},font:{sz:10.5},fill:{fgColor:{rgb:R%2===0?"F3F4F6":"FFFFFF"}}};
      }
    }
  }
  if(mergeCols&&mergeCols.length){
    const merges=computeVerticalMerges(rows,headers,mergeCols);
    if(merges.length){
      ws['!merges']=(ws['!merges']||[]).concat(merges);
      // blank out the value of every cell after the first row of each merged block (keeps borders/fill, avoids repeated text under the merge)
      merges.forEach(m=>{
        for(let R=m.s.r+1;R<=m.e.r;R++){
          const addr=XLSX.utils.encode_cell({r:R,c:m.s.c});
          if(ws[addr]){ws[addr].v="";ws[addr].t="s";}
        }
      });
    }
  }
  ws['!cols']=headers.map(h=>{const maxLen=Math.max(String(h).length,...rows.map(r=>String(r[h]??"").length));return{wch:Math.min(Math.max(maxLen+3,10),42)};});
  ws['!rows']=[{hpt:24}];
  return ws;
}
function downloadXLSXMulti(sheetsArr,filename){
  try{
    const nonEmpty=(sheetsArr||[]).filter(sh=>sh.rows&&sh.rows.length);
    if(!nonEmpty.length){alert("Nothing to export.");return;}
    const wb=XLSX.utils.book_new();
    nonEmpty.forEach(sh=>{
      const ws=styledSheetFromRows(sh.rows,sh.headerColor,sh.mergeCols);
      XLSX.utils.book_append_sheet(wb,ws,(sh.name||"Sheet").slice(0,31));
    });
    XLSX.writeFile(wb,filename);
  }catch(e){ console.error("export failed",e); alert("Export failed: "+e.message); }
}

            {ht.length>0&&<div style={{background:"#EEF2FF",borderRadius:10,padding:"8px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:8,fontSize:13}}><span>📜</span><span style={{color:"#4F46E5",fontWeight:600}}>{ht.length} past renewal{ht.length>1?"s":""}</span><button onClick={()=>go("history")} style={{marginLeft:"auto",background:"#4F46E5",color:"#fff",border:"none",padding:"4px 12px",borderRadius:6,fontWeight:700,fontSize:11}}>View →</button></div>}
            {(()=>{const le=getLg(sid,lk);const amt=computedAmount(le,lk);const paidAmt=Number(le.paidAmount)||0;const rem=Math.max(amt-paidAmt,0);const payLabel=amt<=0?"—":paidAmt<=0?"Unpaid":rem<=0?"Fully Paid":"Partially Paid ("+fmtINR(rem)+" left)";return<div style={{background:"#FFFBEB",border:"1.5px solid #FDE68A",borderRadius:10,padding:"8px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:8,fontSize:13,flexWrap:"wrap"}}><span>💰</span><span style={{color:"#92400E",fontWeight:600}}>Ledger: {le.vendor?(ALLV.find(v=>v.k===le.vendor)?.l||le.vendor):"No vendor set"} · {fmtINR(amt)} · {payLabel}</span><button onClick={()=>go("ledger")} style={{marginLeft:"auto",background:"#D97706",color:"#fff",border:"none",padding:"4px 12px",borderRadius:6,fontWeight:700,fontSize:11}}>Open Ledger →</button></div>;})()}
            {!lc&&<DocExtract onApply={r=>{
              if(r.applied_date)up(sid,lk,"ao",r.applied_date);
              if(r.issue_date)up(sid,lk,"idt",r.issue_date);

              {W.filter(w=>w.g===g).map(w=>{const v=d[w.k];const fi=w.t==="ck"?v===true:(v&&String(v).trim()!=="");const di=lc;const rb=lc?(fi?"#F0FDF4":"#FEF2F2"):"#F9FAFB";const rb2=lc?(fi?"1px solid #BBF7D0":"1px solid #FECACA"):"1px solid #F3F4F6";
                return<div key={w.k} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 12px",background:rb,borderRadius:8,border:rb2,opacity:di?.85:1}}>

                    :w.t==="sl"?<select value={d[w.k]||""} onChange={e=>{if(!di)up(sid,lk,w.k,e.target.value);}} disabled={di} style={{...s.i,maxWidth:200,fontSize:12,opacity:di?.7:1}}><option value="">Select...</option>{w.o.map(o=><option key={o}>{o}</option>)}</select>

                    :<input type={w.t==="nm"?"number":"text"} value={d[w.k]||""} onChange={e=>{if(!di)up(sid,lk,w.k,e.target.value);}} readOnly={di} style={{...s.i,maxWidth:w.t==="dt"?170:(w.k==="an"||w.k==="lno")?520:120,fontSize:12,opacity:di?.7:1}} placeholder={w.k==="an"?"e.g. APP-2025-123456":w.k==="lno"?"e.g. 13326005000552":""}/>}

// ================= LEDGER PAGE =================
function LedgerPage({st,L,VENDORS,ALLV,rates,setRates,lg,getLg,setLgField,computedAmount,isExcludedVendor,addPayment,removePayment,ensureStoreHasLicense,customL,setCustomL,customV,setCustomV,ci,br,go,pg,u,lo}){
  const[tab,setTab]=useState("ledger"); // ledger | rates
  const[nvName,setNvName]=useState("");
  const[billModal,setBillModal]=useState(null); // {storeId,lk} — drives the "Manage Bill" popup
  const[newBillModal,setNewBillModal]=useState(false);
  const[nbStore,setNbStore]=useState("");
  const[nbLic,setNbLic]=useState("");
  const[nbVendor,setNbVendor]=useState("");
  const[nbAddingNew,setNbAddingNew]=useState(false);
  const[nbNewLicName,setNbNewLicName]=useState("");
  const labelStyle={fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:4};

  // ---- filter strip (mirrors ProcureFlow's Bills & Payments: Store / Vendor / Payment / Search) ----
  const[fStore,setFStore]=useState("");
  const[fVendor,setFVendor]=useState("");
  const[fPayment,setFPayment]=useState("");
  const[fSearch,setFSearch]=useState("");

  const rowInfo=(storeId,lk)=>{
    const e=getLg(storeId,lk);
    const amt=computedAmount(e,lk);
    const paid=Number(e.paidAmount)||0;
    const remaining=Math.max(amt-paid,0);
    const excl=isExcludedVendor(e.vendor);
    const payState=excl||amt<=0?"na":paid<=0?"unpaid":remaining<=0?"full":"partial";
    return{e,amt,paid,remaining,excl,payState};
  };

  const addVendor=()=>{
    if(!nvName.trim())return;
    const key="v_"+Date.now();
    const col=EXTRA_COLORS[(VENDORS.length)%EXTRA_COLORS.length];
    setCustomV(p=>[...p,{k:key,l:nvName.trim(),c:col}]);
    setRates(p=>({...p,[key]:{}}));
    setNvName("");
  };

  // ---- every store×license slot that has actually got some bill data on it ----
  const allBills=useMemo(()=>{
    const list=[];
    st.forEach(x=>x.lics.forEach(lk=>{
      const e=getLg(x.id,lk);
      const hasData=e.vendor||e.amount||e.invoiceNo||e.paidAmount||e.billLink||e.appliedDate;
      if(!hasData)return;
      const{amt,paid,remaining,excl,payState}=rowInfo(x.id,lk);
      list.push({x,lk,e,amt,paid,remaining,excl,payState});
    }));
    return list;
  },[st,lg,rates]);

  const filteredBills=useMemo(()=>{
    return allBills.filter(b=>{
      if(fStore&&b.x.id!==fStore)return false;
      if(fVendor&&b.e.vendor!==fVendor)return false;
      if(fPayment&&b.payState!==fPayment)return false;
      if(fSearch){
        const q=fSearch.toLowerCase();
        const lic=L.find(z=>z.k===b.lk);
        const hay=(b.x.name+" "+b.x.city+" "+b.x.brand+" "+(lic?lic.l:b.lk)+" "+(b.e.invoiceNo||"")).toLowerCase();
        if(!hay.includes(q))return false;
      }
      return true;
    });
  },[allBills,fStore,fVendor,fPayment,fSearch,L]);

  const kpi=useMemo(()=>({
    totalBills:filteredBills.length,
    paid:filteredBills.reduce((a,b)=>a+b.paid,0),
    pending:filteredBills.reduce((a,b)=>a+(b.excl?0:b.remaining),0),
    value:filteredBills.reduce((a,b)=>a+b.amt,0),
  }),[filteredBills]);

  const clearFilters=()=>{setFStore("");setFVendor("");setFPayment("");setFSearch("");};

  // ---- export exactly what's currently filtered/visible ----
  const exportBook=()=>{
    const out=filteredBills.map(b=>{
      const lic=L.find(z=>z.k===b.lk);
      const vendor=ALLV.find(v=>v.k===b.e.vendor);
      return{
        "Store":b.x.name,"City":b.x.city,"Brand":b.x.brand,
        "License":lic?lic.l:b.lk,"Compliance Team":vendor?vendor.l:"— Unassigned —",
        "Applied Date":b.e.appliedDate||"—",
        "Invoice Amount (₹)":b.amt,"Invoice No.":b.e.invoiceNo||"—",
        "Paid Amount (₹)":b.paid,"Paid Date":b.e.paidDate||"—",
        "Pending (₹)":b.remaining,"% Paid":b.amt>0?Math.round(b.paid/b.amt*100)+"%":"—",
        "Type":(LEDGER_TYPES.find(t=>t.k===b.e.type)||{}).l||b.e.type,"Status":b.e.status||"NA",
        "Bill Link (G-Drive)":b.e.billLink||"—","Notes":b.e.notes||""
      };
    });
    if(out.length===0){alert("Nothing to export for this view.");return;}
    downloadXLSX(out,"Zippee_Bills_"+new Date().toISOString().slice(0,10)+".xlsx","Bills","4338CA");
  };

  const openNewBill=()=>{
    setNbStore(st[0]?.id||"");setNbLic("");setNbVendor(VENDORS[0]?.k||"");setNbNewLicName("");setNbAddingNew(false);setNewBillModal(true);
  };
  const nbStoreObj=st.find(x=>x.id===nbStore);
  // any master license can be picked here — not just ones already on this store — picking one attaches it to the store
  const nbLicOptions=L;
  const createNewLicenseType=()=>{
    if(!nbNewLicName.trim())return;
    const key="custom_"+Date.now();
    const idx=customL.length;
    const col=EXTRA_COLORS[idx%EXTRA_COLORS.length];
    const ico=EXTRA_ICONS[idx%EXTRA_ICONS.length];
    const newL={k:key,l:nbNewLicName.trim(),i:ico,bg:"linear-gradient(135deg,"+col+"15,"+col+"25)",f:col+"15",b:col+"33",c:col};
    setCustomL(p=>[newL,...p]);
    setNbLic(key);
    setNbNewLicName("");
    setNbAddingNew(false);
  };
  const createBill=()=>{
    if(!nbStore||!nbLic)return;
    ensureStoreHasLicense(nbStore,nbLic);
    setLgField(nbStore,nbLic,"vendor",nbVendor);
    setNewBillModal(false);
    setBillModal({storeId:nbStore,lk:nbLic});
  };

  return<div style={{background:"#F0F2F5",minHeight:"100vh"}}><NV pg={pg} go={go} n={st.length} u={u} lo={lo}/>
  <div style={{padding:"20px 24px"}} className="fi">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>
      <div><h2 style={{fontSize:22,fontWeight:800}}>💰 Bills &amp; Payments</h2><p style={{color:"#6B7280",fontSize:13}}>Every license bill in one place — invoice, G-Drive link, paid &amp; pending.</p></div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setTab(tab==="ledger"?"rates":"ledger")} style={{background:"#EEF2FF",color:"#4F46E5",border:"none",padding:"9px 16px",borderRadius:10,fontWeight:700,fontSize:12}}>{tab==="ledger"?"⚙️ Rate Cards":"← Back to Bills"}</button>
        {tab==="ledger"&&<button onClick={openNewBill} style={s.bt}>➕ New Bill</button>}
      </div>
    </div>

    {tab==="rates"?
    <div style={{...s.cd,borderRadius:14}}>
      <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
        <input value={nvName} onChange={e=>setNvName(e.target.value)} placeholder="New compliance team / vendor name..." style={{...s.i,maxWidth:260}}/>
        <button onClick={addVendor} style={s.bt}>+ Add Team</button>
      </div>
      {VENDORS.map(v=><div key={v.k} style={{marginBottom:22}}>
        <h4 style={{fontSize:14,fontWeight:800,color:v.c,marginBottom:8}}>{v.l}</h4>
        <div style={{overflow:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",minWidth:600}}><thead><tr>
          <th style={{...s.th,background:"#F9FAFB"}}>License</th>
          {LEDGER_TYPES.map(t=><th key={t.k} style={{...s.th,textAlign:"center",background:"#F9FAFB"}}>{t.l}</th>)}
        </tr></thead><tbody>{L.map(l=><tr key={l.k} className="hr"><td style={{...s.td,fontWeight:700,color:l.c,fontSize:12}}>{l.i} {l.l}</td>
          {LEDGER_TYPES.map(t=><td key={t.k} style={s.td}><input value={rates[v.k]?.[l.k]?.[t.k]??""} onChange={e=>{const val=e.target.value;setRates(p=>({...p,[v.k]:{...p[v.k],[l.k]:{...(p[v.k]?.[l.k]||{}),[t.k]:val}}}));}} style={{...s.c,width:80,textAlign:"center"}} placeholder="₹"/></td>)}
        </tr>)}</tbody></table></div>
      </div>)}
    </div>
    :<>
    {/* ---- KPI row (Total Bills / Paid / Pending / Value) — scoped to whatever the filters below show ---- */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12,marginBottom:16}}>
      <div style={{...s.cd,borderTop:"3px solid #4F46E5",borderRadius:14,padding:18}}>
        <div style={{fontSize:26,fontWeight:900}}>{kpi.totalBills}</div>
        <div style={{fontSize:12,color:"#9CA3AF",marginTop:4}}>Total Bills</div>
      </div>
      <div style={{...s.cd,borderTop:"3px solid #16A34A",borderRadius:14,padding:18}}>
        <div style={{fontSize:26,fontWeight:900,color:"#16A34A"}}>{fmtINR(kpi.paid)}</div>
        <div style={{fontSize:12,color:"#9CA3AF",marginTop:4}}>Amount Paid</div>
      </div>
      <div style={{...s.cd,borderTop:"3px solid #DC2626",borderRadius:14,padding:18}}>
        <div style={{fontSize:26,fontWeight:900,color:"#DC2626"}}>{fmtINR(kpi.pending)}</div>
        <div style={{fontSize:12,color:"#9CA3AF",marginTop:4}}>Amount Pending</div>
      </div>
      <div style={{...s.cd,borderTop:"3px solid #7C3AED",borderRadius:14,padding:18}}>
        <div style={{fontSize:26,fontWeight:900,color:"#7C3AED"}}>{fmtINR(kpi.value)}</div>
        <div style={{fontSize:12,color:"#9CA3AF",marginTop:4}}>Total Invoice Value</div>
      </div>
    </div>

    {/* ---- filter strip ---- */}
    <div style={{...s.cd,borderRadius:14,padding:"12px 16px",display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",marginBottom:16}}>
      <span style={{fontSize:10,fontWeight:800,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:".4px"}}>Store</span>
      <select value={fStore} onChange={e=>setFStore(e.target.value)} style={{...s.i,width:"auto",minWidth:150}}><option value="">All</option>{st.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select>
      <span style={{fontSize:10,fontWeight:800,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:".4px"}}>Team</span>
      <select value={fVendor} onChange={e=>setFVendor(e.target.value)} style={{...s.i,width:"auto",minWidth:170}}>

        <optgroup label="Compliance Teams">{VENDORS.map(v=><option key={v.k} value={v.k}>{v.l}</option>)}</optgroup>

      </select>
      <span style={{fontSize:10,fontWeight:800,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:".4px"}}>Payment</span>

      </select>
      <input value={fSearch} onChange={e=>setFSearch(e.target.value)} placeholder="🔍 Search store, license, invoice no..." style={{...s.i,maxWidth:240}}/>
      <button onClick={clearFilters} style={{background:"#F3F4F6",color:"#6B7280",border:"none",padding:"9px 14px",borderRadius:10,fontWeight:600,fontSize:12}}>✕ Clear</button>
      <button onClick={exportBook} style={{...s.gbt,marginLeft:"auto"}}>⬇️ Export</button>
    </div>

    {/* ---- bill cards ---- */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:14}}>

      {filteredBills.map(c=>{

// ================= TASK SHEETS PAGE (multi-tab, per store per license) =================
const SHEET_LIC_STATUSES=["NA","Applied","Doc Submitted","Application No Received","Under Process","Pending","Received","Rejected"];

// ---- Step checklist templates: multi-stage licenses where each stage needs its own transparency ----
const STEP_TEMPLATES={
  clra:{label:"CLRA — full process",steps:[
    "GST received",
    "Shop & Establishment Act received",
    "Rent Agreement / RC ready",
    "RC submitted to hiring partner (vendor)",
    "Form 5 & sheet received from vendor",
    "Form filled & submitted back to vendor",
    "CLRA certificate received from vendor",
    "Certificate submitted to our compliance team",
    "Compliance team submitted to govt. authority",
    "CLRA license received"
  ]},
  fssai:{label:"FSSAI process",steps:[
    "Documents collected","Application submitted","Inspection scheduled","Inspection completed","FSSAI license received"
  ]},
  fire:{label:"Fire NOC process",steps:[
    "Site inspection requested","NOC application submitted","Site visit completed","Fire NOC received"
  ]},
  tradelicense:{label:"Trade License process",steps:[
    "Documents collected","Application submitted","Site verification","Trade license received"
  ]},
  generic3:{label:"Generic — 3 step",steps:["Documents collected","Applied","Received"]},
};
function guessStepTemplate(name){
  const n=(name||"").toLowerCase();
  if(n.includes("clra"))return"clra";
  if(n.includes("fssai"))return"fssai";
  if(n.includes("fire"))return"fire";
  if(n.includes("trade"))return"tradelicense";
  return"";
}

function newSheet(name){
  return{id:"sh_"+Date.now(),name:name||"New Tracker",brand:"",rows:[]};
}
function newSheetRow(storeName,city){
  return{id:"row_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),storeName:storeName||"",city:city||"",assignDate:"",assignedBy:"",docsReceivedDate:"",licenses:[]};
}
function newLicItem(name){
  return{id:"lic_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),name:name||"",applyDate:"",expectedBy:"",status:"NA",link:"",completed:false,stepsTemplate:"",customSteps:[],steps:{}};
}

function SheetsPage({sheets,setSheets,st,L,go,pg,u,lo}){
  const[activeId,setActiveId]=useState(sheets[0]?.id||null);
  useEffect(()=>{ if(!activeId&&sheets.length)setActiveId(sheets[0].id); },[sheets,activeId]);
  const[showAll,setShowAll]=useState(false); // show completed items too
  const[newSheetName,setNewSheetName]=useState("");
  const[addSheetModal,setAddSheetModal]=useState(false);
  const[newRowName,setNewRowName]=useState("");const[newRowCity,setNewRowCity]=useState("");
  const[newLicNameFor,setNewLicNameFor]=useState({}); // rowId -> text
  const[expandedSteps,setExpandedSteps]=useState(()=>new Set());
  const toggleStepsPanel=(licId)=>setExpandedSteps(p=>{const n=new Set(p);n.has(licId)?n.delete(licId):n.add(licId);return n;});

  // ---- editable step checklist helpers ----
  const mapActiveLic=(rowId,licId,fn)=>{
    setSheets(p=>p.map(s0=>{
      if(s0.id!==active.id)return s0;
      return{...s0,rows:s0.rows.map(r=>{
        if(r.id!==rowId)return r;
        return{...r,licenses:r.licenses.map(li=>li.id!==licId?li:fn(li))};
      })};
    }));
  };
  const setTemplate=(rowId,licId,key)=>{
    mapActiveLic(rowId,licId,li=>{
      if(!key)return{...li,stepsTemplate:"",customSteps:[],steps:{}};
      const steps=key==="custom"?((li.customSteps&&li.customSteps.length)?li.customSteps:["Step 1"]):[...(STEP_TEMPLATES[key]&&STEP_TEMPLATES[key].steps?STEP_TEMPLATES[key].steps:[])];
      return{...li,stepsTemplate:key,customSteps:steps,steps:{}};
    });
  };
  const addStep=(rowId,licId)=>{
    mapActiveLic(rowId,licId,li=>({...li,customSteps:[...(li.customSteps||[]),"New step"]}));
  };
  const removeStep=(rowId,licId,idx)=>{
    mapActiveLic(rowId,licId,li=>{
      const newSteps=(li.customSteps||[]).filter((_,i)=>i!==idx);
      const remapped={};
      Object.entries(li.steps||{}).forEach(([k,v])=>{
        const ki=Number(k);
        if(ki<idx)remapped[ki]=v; else if(ki>idx)remapped[ki-1]=v;
      });
      return{...li,customSteps:newSteps,steps:remapped};
    });
  };
  const updStepLabel=(rowId,licId,idx,val)=>{
    mapActiveLic(rowId,licId,li=>{
      const cs=[...(li.customSteps||[])];cs[idx]=val;
      return{...li,customSteps:cs};
    });
  };
  const stepsListFor=(li)=>(li.customSteps&&li.customSteps.length)?li.customSteps:((li.stepsTemplate&&STEP_TEMPLATES[li.stepsTemplate])?STEP_TEMPLATES[li.stepsTemplate].steps:[]);

  const active=sheets.find(x=>x.id===activeId)||null;

  const addSheet=()=>{
    if(!newSheetName.trim())return;
    const sh=newSheet(newSheetName.trim());
    setSheets(p=>[...p,sh]);
    setActiveId(sh.id);
    setNewSheetName("");setAddSheetModal(false);
  };
  const renameSheet=(id,name)=>setSheets(p=>p.map(s0=>s0.id===id?{...s0,name}:s0));
  const delSheet=(id)=>{
    setSheets(p=>p.filter(s0=>s0.id!==id));
    if(activeId===id)setActiveId(null);
  };

  const addRow=()=>{
    if(!newRowName.trim()||!active)return;
    setSheets(p=>p.map(s0=>s0.id!==active.id?s0:{...s0,rows:[...s0.rows,newSheetRow(newRowName.trim(),newRowCity.trim())]}));
    setNewRowName("");setNewRowCity("");
  };
  const delRow=(rowId)=>setSheets(p=>p.map(s0=>s0.id!==active.id?s0:{...s0,rows:s0.rows.filter(r=>r.id!==rowId)}));
  const updRow=(rowId,k,v)=>setSheets(p=>p.map(s0=>s0.id!==active.id?s0:{...s0,rows:s0.rows.map(r=>r.id===rowId?{...r,[k]:v}:r)}));

  const addLic=(rowId)=>{
    const nm=(newLicNameFor[rowId]||"").trim();
    if(!nm)return;
    const row=active?.rows.find(r=>r.id===rowId);
    if(row&&row.licenses.some(li=>li.name.trim().toLowerCase()===nm.toLowerCase())){
      alert('"'+nm+'" is already added for this store — edit the existing row instead of adding it again.');
      setNewLicNameFor(p=>({...p,[rowId]:""}));
      return;
    }
    const guess=guessStepTemplate(nm);
    setSheets(p=>p.map(s0=>s0.id!==active.id?s0:{...s0,rows:s0.rows.map(r=>r.id!==rowId?r:{...r,licenses:[...r.licenses,{...newLicItem(nm),stepsTemplate:guess}]})}));
    setNewLicNameFor(p=>({...p,[rowId]:""}));
  };
  const updLic=(rowId,licId,k,v)=>setSheets(p=>p.map(s0=>s0.id!==active.id?s0:{...s0,rows:s0.rows.map(r=>r.id!==rowId?r:{...r,licenses:r.licenses.map(li=>li.id===licId?{...li,[k]:v}:li)})}));
  const delLic=(rowId,licId)=>setSheets(p=>p.map(s0=>s0.id!==active.id?s0:{...s0,rows:s0.rows.map(r=>r.id!==rowId?r:{...r,licenses:r.licenses.filter(li=>li.id!==licId)})}));

  // progress tracker: per license-name, count Received / total (excluding NA)
  const progress=useMemo(()=>{
    if(!active)return[];
    const map={};
    active.rows.forEach(r=>r.licenses.forEach(li=>{
      if(li.status==="NA")return;
      if(!map[li.name])map[li.name]={received:0,total:0};
      map[li.name].total++;
      if(li.status==="Received")map[li.name].received++;
    }));
    return Object.entries(map);
  },[active]);

  const exportOpen=()=>{
    if(!active)return;
    const out=[];
    const stepRows=[];
    active.rows.forEach(r=>r.licenses.forEach(li=>{
      if(li.completed)return; // only OPEN items
      const stepsList=(li.customSteps&&li.customSteps.length)?li.customSteps:(li.stepsTemplate&&STEP_TEMPLATES[li.stepsTemplate]?STEP_TEMPLATES[li.stepsTemplate].steps:[]);
      const stepsProgress=stepsList.length?stepsList.filter((_,i)=>li.steps?.[i]?.done).length+"/"+stepsList.length:"—";
      out.push({
        "Store":r.storeName,"City":r.city,
        "Assigned On":r.assignDate||"—","Assigned By":r.assignedBy||"—","All Docs Received":r.docsReceivedDate||"—",
        "License":li.name,"Apply Date":li.applyDate||"—","Expected By":li.expectedBy||"—","Status":li.status,
        "Step Checklist Progress":stepsProgress,"Docs Link (G-Drive)":li.link||"—"
      });
      stepsList.forEach((label,i)=>{
        const st0=li.steps?.[i]||{};
        stepRows.push({
          "Store":r.storeName,"City":r.city,"License":li.name,
          "Step #":i+1,"Step Description":label,
          "Done?":st0.done?"✅ Yes":"⬜ No","Completed On":st0.date||"—"
        });
      });
    }));
    if(out.length===0){alert("No open items to export in this tracker.");return;}
    downloadXLSXMulti([
      {rows:out,name:"Open Items",headerColor:"6D28D9"},
      {rows:stepRows,name:"Step Checklist Detail",headerColor:"7C3AED",mergeCols:["Store","License"]}
    ],"Zippee_"+active.name.replace(/[^a-z0-9]+/gi,"_")+"_Open_"+new Date().toISOString().slice(0,10)+".xlsx");
  };

  const totalOpen=active?active.rows.reduce((a,r)=>a+r.licenses.filter(li=>!li.completed).length,0):0;
  const totalDone=active?active.rows.reduce((a,r)=>a+r.licenses.filter(li=>li.completed).length,0):0;

  return<div style={{background:"#F0F2F5",minHeight:"100vh"}}><NV pg={pg} go={go} n={st.length} u={u} lo={lo}/>
  <div style={{padding:"20px 24px"}} className="fi">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>
      <div><h2 style={{fontSize:22,fontWeight:800}}>✅ Task Trackers</h2><p style={{color:"#6B7280",fontSize:13}}>Sheet-wise store → license progress. Keep separate trackers per brand / batch, work on them side by side.</p></div>
      <button onClick={()=>setAddSheetModal(true)} style={s.bt}>➕ New Tracker Sheet</button>
    </div>

    {/* tabs */}
    <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
      {sheets.map(s0=><div key={s0.id} onClick={()=>setActiveId(s0.id)} style={{display:"flex",alignItems:"center",gap:6,background:activeId===s0.id?"linear-gradient(135deg,#4F46E5,#6366F1)":"#fff",color:activeId===s0.id?"#fff":"#374151",border:"1px solid "+(activeId===s0.id?"#4F46E5":"#E5E7EB"),padding:"8px 14px",borderRadius:12,cursor:"pointer",fontSize:12,fontWeight:700}}>
        📋 {s0.name}
        <span onClick={e=>{e.stopPropagation();if(confirm("Delete tracker \""+s0.name+"\"? This removes all its data."))delSheet(s0.id);}} style={{opacity:.7,fontSize:11}}>✕</span>
      </div>)}
      {sheets.length===0&&<span style={{color:"#9CA3AF",fontSize:13}}>No tracker sheets yet — create one to get started.</span>}
    </div>

    {active&&<>
      <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
        <input value={active.name} onChange={e=>renameSheet(active.id,e.target.value)} style={{...s.i,maxWidth:280,fontWeight:700}}/>
        <input value={active.brand} onChange={e=>setSheets(p=>p.map(s0=>s0.id!==active.id?s0:{...s0,brand:e.target.value}))} placeholder="Brand (optional)" style={{...s.i,maxWidth:160}}/>
        <div style={{...s.cd,padding:"8px 16px",borderRadius:10,textAlign:"center"}}><strong style={{color:"#D97706"}}>{totalOpen}</strong> <span style={{fontSize:11,color:"#6B7280"}}>open</span></div>
        <div style={{...s.cd,padding:"8px 16px",borderRadius:10,textAlign:"center"}}><strong style={{color:"#16A34A"}}>{totalDone}</strong> <span style={{fontSize:11,color:"#6B7280"}}>completed</span></div>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,fontWeight:600,color:"#6B7280"}}><input type="checkbox" checked={showAll} onChange={e=>setShowAll(e.target.checked)}/> Show completed items</label>
        <button onClick={exportOpen} style={{...s.gbt,marginLeft:"auto"}}>⬇️ Export Open Items</button>
      </div>

      {progress.length>0&&<div style={{...s.cd,padding:"12px 18px",marginBottom:16,borderRadius:14,display:"flex",gap:10,flexWrap:"wrap"}}>
        <strong style={{fontSize:12,color:"#374151",marginRight:4}}>📊 Progress Tracker:</strong>
        {progress.map(([name,p0])=><Bg key={name} t={name+": "+p0.received+"/"+p0.total} bg={p0.received===p0.total?"#DCFCE7":"#FEF3C7"} c={p0.received===p0.total?"#16A34A":"#D97706"}/>)}
      </div>}

      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        <input value={newRowName} onChange={e=>setNewRowName(e.target.value)} placeholder="Store name..." list="storeNamesDL" style={{...s.i,maxWidth:220}} onKeyDown={e=>e.key==="Enter"&&addRow()}/>
        <datalist id="storeNamesDL">{st.map(x=><option key={x.id} value={x.name}/>)}</datalist>
        <input value={newRowCity} onChange={e=>setNewRowCity(e.target.value)} placeholder="City..." style={{...s.i,maxWidth:150}} onKeyDown={e=>e.key==="Enter"&&addRow()}/>
        <button onClick={addRow} style={s.bt}>+ Add Store Row</button>
      </div>

      <div style={{display:"grid",gap:14}}>
        {active.rows.length===0&&<div style={{...s.cd,textAlign:"center",padding:50,borderRadius:16}}><div style={{fontSize:44,marginBottom:10}}>🏪</div><p style={{color:"#6B7280",fontSize:13}}>Add a store row above to start tracking its licenses.</p></div>}
        {active.rows.map(r=>{
          const visLics=showAll?r.licenses:r.licenses.filter(li=>!li.completed);
          return<div key={r.id} style={{...s.cd,borderRadius:16,padding:18}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,flexWrap:"wrap"}}>
              <input value={r.storeName} onChange={e=>updRow(r.id,"storeName",e.target.value)} style={{...s.c,fontWeight:800,fontSize:14,minWidth:180}}/>
              <input value={r.city} onChange={e=>updRow(r.id,"city",e.target.value)} placeholder="City" style={{...s.c,minWidth:100}}/>
              <Bg t={r.licenses.filter(li=>!li.completed).length+" open / "+r.licenses.length+" total"} bg="#EEF2FF" c="#4F46E5"/>
              <button onClick={()=>delRow(r.id)} style={{marginLeft:"auto",background:"#FEE2E2",color:"#DC2626",border:"none",padding:"5px 10px",borderRadius:6,fontSize:11,fontWeight:700}}>🗑️ Remove Store</button>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,flexWrap:"wrap",background:"#F9FAFB",border:"1px solid #F3F4F6",borderRadius:10,padding:"8px 10px"}}>
              <label style={{fontSize:10,fontWeight:700,color:"#9CA3AF"}}>Assigned On</label><input type="date" value={r.assignDate||""} onChange={e=>updRow(r.id,"assignDate",e.target.value)} style={{...s.c}}/>
              <label style={{fontSize:10,fontWeight:700,color:"#9CA3AF"}}>Assigned By</label><input value={r.assignedBy||""} onChange={e=>updRow(r.id,"assignedBy",e.target.value)} placeholder="Name" style={{...s.c,maxWidth:130}}/>
              <label style={{fontSize:10,fontWeight:700,color:"#9CA3AF"}}>All Docs Received</label><input type="date" value={r.docsReceivedDate||""} onChange={e=>updRow(r.id,"docsReceivedDate",e.target.value)} style={{...s.c}}/>
            </div>
            {visLics.length>0&&<div style={{marginBottom:10}}>
              <div style={{display:"grid",gridTemplateColumns:"160px 130px 130px 70px 140px 1fr 150px 150px 34px",gap:8,padding:"0 12px 6px",fontSize:10,fontWeight:800,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:".4px"}}>
                <div>License</div><div>Applied Date</div><div>Expected By</div><div>Days</div><div>Status</div><div>Docs Link (G-Drive)</div><div>Step Checklist</div><div>Action</div><div></div>
              </div>
              <div style={{display:"grid",gap:6}}>
              {visLics.map(li=>{
                const daysSince=li.applyDate?Math.floor((new Date()-new Date(li.applyDate))/864e5):null;
                const overdue=li.expectedBy&&!li.completed&&new Date(li.expectedBy)<new Date();
                const tmpl=li.stepsTemplate?STEP_TEMPLATES[li.stepsTemplate]:null;
                const stepsList=stepsListFor(li);
                const stepsDone=stepsList.filter((_,i)=>li.steps?.[i]?.done).length;
                const isOpen=expandedSteps.has(li.id);
                return<Fragment key={li.id}>
                <div style={{display:"grid",gridTemplateColumns:"160px 130px 130px 70px 140px 1fr 150px 150px 34px",gap:8,alignItems:"center",padding:"8px 12px",background:li.completed?"#F0FDF4":"#FAFBFC",border:"1px solid "+(li.completed?"#BBF7D0":"#F3F4F6"),borderRadius:10}}>
                <input value={li.name} onChange={e=>updLic(r.id,li.id,"name",e.target.value)} list="licNamesDL" style={{...s.c,fontWeight:700}}/>
                <input type="date" value={li.applyDate} onChange={e=>updLic(r.id,li.id,"applyDate",e.target.value)} style={{...s.c}}/>
                <input type="date" value={li.expectedBy} onChange={e=>updLic(r.id,li.id,"expectedBy",e.target.value)} style={{...s.c,background:overdue?"#FEE2E2":"#FAFBFC"}}/>
                <div style={{fontSize:11,fontWeight:700,color:overdue?"#DC2626":"#6B7280",textAlign:"center"}}>{daysSince!==null?daysSince+"d":"—"}</div>
                <select value={li.status} onChange={e=>updLic(r.id,li.id,"status",e.target.value)} style={{...s.c}}>{SHEET_LIC_STATUSES.map(o=><option key={o}>{o}</option>)}</select>
                <div style={{display:"flex",gap:6}}><input value={li.link} onChange={e=>updLic(r.id,li.id,"link",e.target.value)} placeholder="G-Drive link..." style={{...s.c,flex:1,minWidth:0}}/>{li.link&&<a href={li.link} target="_blank" rel="noopener noreferrer" style={{background:"#16A34A",color:"#fff",padding:"5px 10px",borderRadius:6,fontSize:11,fontWeight:700,textDecoration:"none",whiteSpace:"nowrap"}}>Open↗</a>}</div>
                <div style={{display:"flex",flexDirection:"column",gap:3}}>
                  <select value={li.stepsTemplate||""} onChange={e=>setTemplate(r.id,li.id,e.target.value)} style={{...s.c,fontSize:10,padding:"3px 4px"}}>
                    <option value="">No step checklist</option>
                    {Object.entries(STEP_TEMPLATES).map(([k,t])=><option key={k} value={k}>{t.label}</option>)}
                    <option value="custom">✏️ Custom checklist</option>
                  </select>
                  {stepsList.length>0&&<button onClick={()=>toggleStepsPanel(li.id)} style={{background:stepsDone===stepsList.length?"#DCFCE7":"#FEF3C7",color:stepsDone===stepsList.length?"#16A34A":"#D97706",border:"none",borderRadius:6,padding:"2px 6px",fontSize:10,fontWeight:700}}>{stepsDone}/{stepsList.length} steps {isOpen?"▲":"▼"}</button>}
                </div>
                <button onClick={()=>updLic(r.id,li.id,"completed",!li.completed)} style={{background:li.completed?"#F3F4F6":"linear-gradient(135deg,#16A34A,#22C55E)",color:li.completed?"#6B7280":"#fff",border:"none",padding:"6px 10px",borderRadius:8,fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>{li.completed?"↩️ Reopen":"✓ Complete"}</button>
                <button onClick={()=>delLic(r.id,li.id)} style={{background:"#FEE2E2",color:"#DC2626",border:"none",padding:"6px 8px",borderRadius:6,fontSize:11}}>🗑️</button>
              </div>
              {stepsList.length>0&&isOpen&&<div style={{background:"#F5F3FF",border:"1.5px solid #DDD6FE",borderRadius:10,padding:"10px 14px"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
                  <div style={{fontSize:11,fontWeight:800,color:"#7C3AED"}}>📋 Step checklist for "{li.name}" ({stepsDone}/{stepsList.length} done) — editable</div>
                  <span style={{fontSize:10,color:"#9CA3AF"}}>rename, reorder-by-editing, add or remove steps as needed for this store</span>
                </div>
                <div style={{marginBottom:8}}><Bar v={Math.round(stepsDone/stepsList.length*100)} c="#7C3AED" h={6}/></div>
                <div style={{display:"grid",gap:6}}>
                  {stepsList.map((stepLabel,i)=>{const st0=li.steps?.[i]||{done:false,date:""};return<div key={i} style={{display:"flex",alignItems:"center",gap:8,background:"#fff",borderRadius:8,padding:"6px 10px",border:"1px solid #EDE9FE"}}>
                    <input type="checkbox" checked={!!st0.done} onChange={e=>updLic(r.id,li.id,"steps",{...(li.steps||{}),[i]:{...st0,done:e.target.checked}})} style={{width:16,height:16,accentColor:"#7C3AED",flexShrink:0}}/>
                    <span style={{fontSize:11,color:"#9CA3AF",fontWeight:700,width:16,flexShrink:0}}>{i+1}.</span>
                    <input value={stepLabel} onChange={e=>updStepLabel(r.id,li.id,i,e.target.value)} style={{...s.c,flex:1,fontWeight:600,color:st0.done?"#16A34A":"#374151"}}/>
                    <input type="date" value={st0.date||""} onChange={e=>updLic(r.id,li.id,"steps",{...(li.steps||{}),[i]:{...st0,date:e.target.value}})} style={{...s.c,fontSize:11,flexShrink:0}}/>
                    <button onClick={()=>removeStep(r.id,li.id,i)} title="Remove this step" style={{background:"#FEE2E2",color:"#DC2626",border:"none",borderRadius:6,padding:"4px 7px",fontSize:10,flexShrink:0}}>✕</button>
                  </div>;})}
                </div>
                <div style={{marginTop:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <button onClick={()=>addStep(r.id,li.id)} style={{background:"#EEF2FF",color:"#4F46E5",border:"none",padding:"5px 12px",borderRadius:6,fontSize:11,fontWeight:700}}>+ Add step</button>
                  <button onClick={()=>{updLic(r.id,li.id,"stepsTemplate","");updLic(r.id,li.id,"customSteps",[]);updLic(r.id,li.id,"steps",{});}} style={{background:"#FEE2E2",color:"#DC2626",border:"none",padding:"4px 10px",borderRadius:6,fontSize:10,fontWeight:700}}>Remove checklist</button>
                </div>
              </div>}
              </Fragment>;})}
              </div>
            </div>}
            <div style={{display:"flex",gap:6}}>
              <input value={newLicNameFor[r.id]||""} onChange={e=>setNewLicNameFor(p=>({...p,[r.id]:e.target.value}))} list="licNamesDL" placeholder="License name (e.g. FSSAI, Trade License...)" style={{...s.i,maxWidth:280}} onKeyDown={e=>e.key==="Enter"&&addLic(r.id)}/>
              <button onClick={()=>addLic(r.id)} style={{background:"#EEF2FF",color:"#4F46E5",border:"none",padding:"9px 16px",borderRadius:10,fontWeight:700,fontSize:12}}>+ Add License</button>
            </div>
          </div>;
        })}
      </div>
      <datalist id="licNamesDL">{L.map(l=><option key={l.k} value={l.l}/>)}</datalist>
    </>}

    {addSheetModal&&<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:20}} onClick={()=>setAddSheetModal(false)}>
      <div style={{background:"#fff",borderRadius:20,padding:32,maxWidth:420,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,.2)"}} onClick={e=>e.stopPropagation()} className="fi">
        <h3 style={{fontSize:18,fontWeight:800,marginBottom:16}}>➕ New Tracker Sheet</h3>
        <p style={{color:"#6B7280",fontSize:13,marginBottom:14}}>Use separate sheets to manage different brands or launch batches independently — e.g. "Brand A — New Store Onboarding" and "Brand B — Q3 Renewals".</p>
        <input value={newSheetName} onChange={e=>setNewSheetName(e.target.value)} placeholder="Tracker name..." style={{...s.i,marginBottom:16}} onKeyDown={e=>e.key==="Enter"&&addSheet()}/>
        <div style={{display:"flex",gap:10}}>
          <button onClick={addSheet} disabled={!newSheetName.trim()} style={{...s.bt,flex:1,opacity:newSheetName.trim()?1:.4}}>Create</button>
          <button onClick={()=>setAddSheetModal(false)} style={{background:"#F3F4F6",color:"#6B7280",border:"none",padding:"10px 22px",borderRadius:10,fontWeight:700,fontSize:13}}>Cancel</button>
        </div>
      </div>
    </div>}
  </div></div>;
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
